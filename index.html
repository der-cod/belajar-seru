.dot{cursor:pointer}
.sh{width:100%;max-width:5.5rem;background:none;border:0;padding:4px}
.shg{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:24rem;margin:0 auto}

.opt.on{outline:4px solid var(--ac)}

.tb{width:100%;border-collapse:collapse;font-size:.85rem;background:var(--card);border-radius:1rem;overflow:hidden;margin:.6rem 0}.tb th,.tb td{padding:.4rem .3rem;border-bottom:1px solid rgba(0,0,0,.1)}.tb td:first-child{text-align:left}
</style>
</head>

var PTH=[
function(){return[[30,160],[290,160]]},
function(){return[[160,30],[160,290]]},
function(){return[[40,280],[280,40]]},
function(){var p=[];for(var i=0;i<=6;i++)p.push([30+i*43,i%2?80:240]);return p},
function(){var p=[];for(var x=20;x<=300;x+=6)p.push([x,160+70*Math.sin(x/28)]);return p},
function(){var p=[];for(var x=20;x<=300;x+=6)p.push([x,260-170*Math.abs(Math.sin(x/45))]);return p},
function(){var p=[];for(var a=0;a<=40;a++)p.push([160+110*Math.cos(a/40*6.283-1.57),160+110*Math.sin(a/40*6.283-1.57)]);return p},
function(){return[[60,60],[260,60],[260,260],[60,260],[60,60]]},
function(){return[[160,40],[280,270],[40,270],[160,40]]},

el(st,"p","q","Cari semua <b class=big>"+SHN[k]+"</b>");el(st,"div","sh","").style.cssText="width:6rem;margin:0 auto";st.lastChild.innerHTML=svg(k,"#ffd34d");
for(j=0;j<12;j++)c.push(j<4?k:(k+1+rnd(7))%8);c=shuf(c);var g=el(st,"div","shg");
c.forEach(function(v){var b=el(g,"button","sh",svg(v));b.onclick=function(){if(b.dataset.on)return;if(v==k){b.dataset.on=1;b.innerHTML=svg(v,"#ffd34d");if(++n==4)ok(SHN[k])}else bad()}})}
